# SỬ DỤNG H2 DATABASE CHẠY TRÊN RAM KHI DEPLOY RENDER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:fashion_shop;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

# CẤU HÌNH HIBERNATE CHO H2 DIALECT
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# GIỮ NGUYÊN CÁC CẤU HÌNH KHÁC CỦA BẠN
spring.thymeleaf.cache=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate=ERROR

spring.jackson.default-property-inclusion=non_null
server.port=8080

openai.api.url=https://api.groq.com/openai/v1
openai.api.key=YOUR_KEY
openai.api.model=llama-3.3-70b-versatile
sendgrid.api-key=SG.dummy_key_for_local_testing_only_1234567890