spring.datasource.url=jdbc:mysql://localhost:3306/fashion_shop?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.cache=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate=ERROR

spring.jackson.default-property-inclusion=non_null

server.port=8080

openai.api.url=https://api.groq.com/openai/v1
openai.api.key=YOUR_KEY
openai.api.model=llama-3.3-70b-versatile
sendgrid.api-key=SG.dummy_key_for_local_testing_only_1234567890
