<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - LUXE FW</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .profile-container { max-width: 900px; margin: 4rem auto; padding: 0 2rem; display: grid; grid-template-columns: 280px 1fr; gap: 3rem; }
        .sidebar-card { background: white; border-radius: 12px; padding: 2rem; border: 1px solid var(--border); height: fit-content; }
        .profile-nav { list-style: none; margin-top: 1.5rem; }
        .profile-nav li { padding: 1rem; cursor: pointer; border-bottom: 1px solid #f0f0f0; transition: color 0.3s; font-weight: 500; }
        .profile-nav li.active { color: var(--accent); font-weight: 700; border-left: 3px solid var(--accent); }
        .content-card { background: white; border-radius: 12px; padding: 3rem; border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
        .profile-header { display: flex; align-items: center; gap: 1.5rem; border-bottom: 1px solid #f0f0f0; padding-bottom: 2rem; margin-bottom: 2rem; }
        .avatar-circle { width: 80px; height: 80px; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; border-radius: 50%; font-size: 2rem; font-weight: 700; text-transform: uppercase; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">LUXE<span>FW</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="products.html">Products</a></li>
            <li><a href="about.html">About</a></li>
        </ul>
        <div class="nav-actions" id="auth-links"></div>
    </nav>

    <main class="profile-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar-card">
            <div style="text-align: center;">
                <div class="avatar-circle" id="user-avatar" style="margin: 0 auto;">?</div>
                <h3 id="display-name" style="margin-top: 1rem; color: var(--text-main);">User</h3>
                <p id="display-username" style="color: var(--text-muted); font-size: 0.9rem;">@username</p>
            </div>
            <ul class="profile-nav">
                <li class="active" onclick="switchSection('info')">Thông tin cá nhân</li>
                <li onclick="switchSection('password')">Đổi mật khẩu</li>
                <li><a href="orders.html" style="text-decoration: none; color: inherit;">Lịch sử đơn hàng</a></li>
                <li onclick="handleLogout()" style="color: #d32f2f;">Đăng xuất</li>
            </ul>
        </aside>

        <!-- Main Content -->
        <div id="section-info" class="content-card">
            <h2 style="margin-bottom: 2rem;">Cập nhật thông tin</h2>
            <form id="profile-form">
                <input type="hidden" id="user-id">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Họ và tên</label>
                        <input type="text" id="fullname" class="form-control" placeholder="Nhập họ tên của bạn" required>
                    </div>
                    <div class="form-group">
                        <label>Số điện thoại</label>
                        <input type="tel" id="phone" class="form-control" placeholder="Số điện thoại" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Email" required>
                    </div>
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Địa chỉ</label>
                        <input type="text" id="address" class="form-control" placeholder="Địa chỉ chi tiết" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 2rem; width: 100%; padding: 1rem;">Lưu thay đổi</button>
            </form>
        </div>

        <div id="section-password" class="content-card" style="display: none;">
            <h2 style="margin-bottom: 2rem;">Đổi mật khẩu</h2>
            <form id="password-form">
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Mật khẩu hiện tại</label>
                    <input type="password" id="old-pass" class="form-control" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label>Mật khẩu mới</label>
                    <input type="password" id="new-pass" class="form-control" required>
                </div>
                <div class="form-group" style="margin-bottom: 2rem;">
                    <label>Xác nhận mật khẩu mới</label>
                    <input type="password" id="confirm-pass" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Cập nhật mật khẩu</button>
            </form>
        </div>
    </main>

    <footer style="background: var(--primary); color: white; padding: 3rem 5%; text-align: center; margin-top: 5rem;">
        <h2 style="color: white; margin-bottom: 1rem;">LUXE<span>FW</span></h2>
        <p style="color: #b2bec3;">Nơi thời trang bắt đầu. Tất cả các quyền được bảo lưu &copy; 2026</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/chat-widget.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('jwtToken');
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            const user = JSON.parse(localStorage.getItem('user') || '{}');
            document.getElementById('display-username').innerText = `@${user.username}`;
            document.getElementById('user-avatar').innerText = user.username.charAt(0);
            
            // Fetch info from profile endpoint
            try {
                const res = await fetchAPI('/user/profile');
                const u = res.data;
                if (u) {
                    document.getElementById('user-id').value = u.id;
                    document.getElementById('fullname').value = u.fullName || '';
                    document.getElementById('display-name').innerText = u.fullName || user.username;
                    document.getElementById('email').value = u.email || '';
                    document.getElementById('phone').value = u.phone || '';
                    if (u.address) {
                        document.getElementById('address').value = `${u.address.addressLine || ''}, ${u.address.ward || ''}, ${u.address.district || ''}, ${u.address.city || ''}`.replace(/^, /, '');
                    }
                } else {
                    document.getElementById('display-name').innerText = user.username;
                }
            } catch (err) {
                console.error("Lấy thông tin profile thất bại", err);
                document.getElementById('display-name').innerText = user.username;
            }
        });

        window.switchSection = function(section) {
            document.querySelectorAll('.profile-nav li').forEach(li => li.classList.remove('active'));
            document.getElementById('section-info').style.display = section === 'info' ? 'block' : 'none';
            document.getElementById('section-password').style.display = section === 'password' ? 'block' : 'none';
            event.currentTarget.classList.add('active');
        }

        document.getElementById('profile-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('user-id').value;
            if (!id) {
                showToast("Vui lòng đặt hàng ít nhất một lần để khởi tạo hồ sơ (giới hạn backend).", "warning");
                return;
            }
            const data = {
                fullName: document.getElementById('fullname').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                addressLine: document.getElementById('address').value
            };
            try {
                // Backend: /api/user/profile/{id}
                await fetchAPI(`/user/profile/${id}`, { method: 'PUT', body: JSON.stringify(data) });
                showToast("Cập nhật thông tin thành công!", "success");
            } catch (err) {
                showToast("Lỗi khi cập nhật.", "error");
            }
        };

        document.getElementById('password-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('user-id').value;
            const currentPassword = document.getElementById('old-pass').value;
            const newPassword = document.getElementById('new-pass').value;
            const confirmPassword = document.getElementById('confirm-pass').value;

            if (newPassword !== confirmPassword) {
                showToast("Mật khẩu xác nhận không khớp.", "error");
                return;
            }

            try {
                // Backend: /api/user/{id}/change-password
                await fetchAPI(`/user/${id}/change-password`, { 
                    method: 'PUT', 
                    body: JSON.stringify({ currentPassword, newPassword, confirmPassword }) 
                });
                showToast("Đổi mật khẩu thành công!", "success");
                e.target.reset();
            } catch (err) {
                showToast("Đổi mật khẩu thất bại. Kiểm tra lại mật khẩu cũ.", "error");
            }
        };
    </script>
</body>
</html>
